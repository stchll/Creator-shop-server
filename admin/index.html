<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Shop | Адмін</title>

    <link rel="stylesheet" href="./style.css">

    <link href="https://fonts.googleapis.com/css?family=Montserrat+Alternates:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic" rel="stylesheet" />
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css' integrity='sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==' crossorigin='anonymous'/>
</head>
<body>
    <div class="wrap">
        <header>
            <h1>Creator Shop | Адмін</h1>
        </header>

        <section class="view" id="view-products">
            <div class="create-product-modal">
                <div class="top">
                    <h3>Додавання товару</h3>

                    <button id="close-create-modal">X</button>
                </div>

                <form id="create-product-form">
                    <input name="title" type="text" placeholder="Назва товару" id="create-product-title" required>

                    <textarea name="description" id="create-product-description" placeholder="Опис товару" required></textarea>

                    <input type="number" id="create-product-price" name="price" placeholder="Ціна товару" required>

                    <select id="product-rating-select" name="rating" required>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>

                    <input type="file" id="product-file-select" name="image" required>

                    <button type="submit" id="product-create-btn">Створити</button>
                </form>
            </div>

            <table class="products-table">
                <thead>
                    <tr>
                        <td>Image</td>
                        <td>Title</td>
                        <td>Description</td>
                        <td>Price</td>
                        <td>Rating</td>
                        <td>Controll</td>
                    </tr>
                </thead>

                <tbody></tbody>

                <tfoot>
                    <tr>
                        <td colspan="1">
                            <button id="create-modal-open">Створити Товар</button>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </section>
    </div>

    <script src="./main.js"></script>
</body>
</html>
