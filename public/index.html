<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Shop</title>

    <link rel="stylesheet" href="./style.css">

    <link
        href="https://fonts.googleapis.com/css?family=Montserrat+Alternates:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic"
        rel="stylesheet" />
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css'
        integrity='sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=='
        crossorigin='anonymous' />
</head>

<body>
    <div class="loadingPage">
        <h1><span>/</span>Creator Shop</h1>
    </div>

    <div class="wrap">
        <header>
            <div class="container header-inner">
                <h3><span>/</span>Creator Shop</h3>

                <div class="buttons">
                    <button>Explore</button>
                </div>
            </div>
        </header>

        <div class="homePage">
            <div class="container">
                <div class="bannerContainer">
                    <div class="textPart">
                        <div class="wrapper">
                            <h1>Welcome to <br> <span>/</span>Creator Shop</h1>

                            <div class="buttons">
                                <button>View Goods</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="aboutPage">
            <div class="titlePart">
                <h2><span>/</span>About Us</h2>
            </div>

            <div class="textPart">
                <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Laborum, dolorum?</p>
            </div>
        </div>

        <div class="goodsPage">
            <div class="titlePart">
                <h2><Span>/</Span>Goods</h2>
            </div>

            <div class="categoriesPart">
                <div class="titlePart">
                    <p>Categories</p>
                </div>

                <div class="categoryPart">
                    <button class="selected">All</button>
                    <button>Clothes</button>
                </div>
            </div>

            <div class="goodsPart"></div>
        </div>
    </div>

    <script src="./main.js"></script>
</body>

</html>
